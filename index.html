/* V15 visual system */
:root{
  --radius:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 0 rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.035);
  --shadow-float:0 24px 70px rgba(0,0,0,.14);
  --focus:0 0 0 3px rgba(21,21,21,.12);
}
[data-theme=dark]{
  --shadow-card:0 1px 0 rgba(255,255,255,.03),0 12px 34px rgba(0,0,0,.20);
  --shadow-float:0 24px 80px rgba(0,0,0,.38);
  --focus:0 0 0 3px rgba(241,241,235,.14);
}
body{letter-spacing:-.006em}
::selection{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0;box-shadow:var(--focus)}
.side{padding:22px 14px}
.brand{padding:5px 11px 30px}
.brand b{font-size:18px;letter-spacing:-.03em}
.brand small{font-size:8px;letter-spacing:.19em}
.nav{gap:4px}
.nav button{padding:10px 12px;border-radius:10px;transition:background .16s ease,transform .16s ease}
.nav button:hover{transform:translateX(2px)}
.nav button.active{font-weight:650}
.wrap{padding:34px 42px 110px}
.top{margin-bottom:34px}
.top h1{max-width:920px}
.top .sub{max-width:760px}
.topactions .btn{border-radius:9px}
.card,.metric,.tablewrap,.modalbox,.cmd{border-radius:var(--radius);box-shadow:var(--shadow-card)}
.card{padding:20px}
.metric{padding:18px}
.metric .num{font-size:30px}
.grid{gap:14px}
.sectionhead{margin-top:34px}
.tablewrap{overflow:hidden}
table{font-size:13px}
th{background:var(--soft);font-size:9px;letter-spacing:.12em}
td,th{padding:12px 13px}
tr:hover td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.tag{border-radius:999px;padding:3px 8px}
.progress{height:7px;border-radius:99px;background:var(--soft)}
.progress i{border-radius:99px}
.btn{border-radius:9px;transition:all .16s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.06)}
.kpi{font-size:10px}
.bottom{backdrop-filter:blur(14px)}
.modalbox{box-shadow:var(--shadow-float)}
.cmd{box-shadow:var(--shadow-float)}
.toast{border-radius:10px;box-shadow:var(--shadow-float)}
@media(max-width:900px){
  .wrap{padding:24px 18px 100px}
  .top{display:block}
  .topactions{justify-content:flex-start;margin-top:18px}
}
@media(max-width:620px){
  h1{font-size:38px}
  h2{font-size:22px}
  .card{padding:16px}
}

.v15hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:14px;margin-bottom:14px}
.heroCard{padding:25px;background:var(--ink);color:var(--bg);border-radius:16px;min-height:245px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-card)}
[data-theme=dark] .heroCard{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.heroCard .eyebrow{color:inherit;opacity:.55}
.heroCard h2{font-size:clamp(28px,3.4vw,48px);letter-spacing:-.055em;max-width:760px;margin-top:10px}
.heroCard p{color:inherit;opacity:.65;max-width:650px}
.heroMeta{display:flex;gap:8px;flex-wrap:wrap}
.heroMeta span{border:1px solid rgba(255,255,255,.18);padding:6px 9px;border-radius:999px;font-size:10px}
[data-theme=dark] .heroMeta span{border-color:var(--line)}
.focusCard{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:16px;display:flex;flex-direction:column;justify-content:space-between}
.focusTop{display:flex;justify-content:space-between;gap:12px}
.focusIndex{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.focusCard h3{font-size:19px;letter-spacing:-.025em;margin-top:9px}
.focusCard .focusReason{font-size:12px}
.focusCard .focusAction{display:flex;gap:7px;margin-top:18px}
.focusCard .focusAction .btn{flex:1}
.miniLabel{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.domainGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.domainTile{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.domainTile:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--shadow-card)}
.domainTileTop{display:flex;justify-content:space-between;gap:10px}
.domainTile .name{font-weight:650;line-height:1.2}
.domainTile .small{font-size:10px;color:var(--muted);margin-top:7px}
.domainTile .bar{height:4px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden}
.domainTile .bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.insightGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.insight{padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.insight strong{display:block;font-size:23px;letter-spacing:-.04em;margin-top:6px}
.insight p{font-size:11px}
@media(max-width:1100px){.domainGrid{grid-template-columns:repeat(2,1fr)}.v15hero{grid-template-columns:1fr}.insightGrid{grid-template-columns:1fr}}
@media(max-width:620px){.domainGrid{grid-template-columns:1fr}.heroCard{min-height:260px}}

/* ===== V15 SYSTEM LAYER ===== */
.system-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:14px}
.system-strip .left,.system-strip .right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.system-dot{width:7px;height:7px;border-radius:50%;background:var(--ink);display:inline-block}
.system-strip span{font-size:10px;color:var(--muted)}
.system-strip b{font-size:10px}
.surfaceNav{display:flex;gap:6px;overflow:auto;padding:3px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.surfaceNav button{border:0;background:transparent;color:var(--muted);padding:9px 10px;font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.surfaceNav button.active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.commandGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
.workHero{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:14px;margin-bottom:14px}
.workHero h2{font-size:28px;letter-spacing:-.045em;margin:7px 0}
.workHero p{max-width:720px}
.filterBar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.filterBar .btn.active{background:var(--ink);color:var(--bg)}
.phaseRail{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}
.phaseNode{border:1px solid var(--line);padding:10px;border-radius:9px;background:var(--panel)}
.phaseNode b{display:block;font-size:10px}
.phaseNode span{font-size:9px;color:var(--muted)}
.phaseNode i{display:block;height:3px;background:var(--soft);margin-top:8px;border-radius:99px;overflow:hidden}
.phaseNode i:after{content:"";display:block;height:100%;width:var(--w);background:var(--ink)}
.evidenceHero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.evidenceStat{padding:15px;border:1px solid var(--line);background:var(--panel);border-radius:11px}
.evidenceStat strong{display:block;font-size:25px;letter-spacing:-.04em;margin-top:4px}
.timeline{position:relative;margin-left:5px;padding-left:20px;border-left:1px solid var(--line)}
.timelineItem{position:relative;padding:0 0 17px}
.timelineItem:before{content:"";position:absolute;left:-25px;top:4px;width:8px;height:8px;border:2px solid var(--panel);background:var(--ink);border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.authorityBand{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.scoreRing{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ink) var(--score),var(--soft) 0);position:relative;margin:auto}
.scoreRing:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.scoreRing strong{position:relative;z-index:1;font-size:34px;letter-spacing:-.06em}
.capabilityMatrix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.matrixRow{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel)}
.matrixTop{display:flex;justify-content:space-between;gap:8px}
.matrixTop b{font-size:12px}
.matrixTop span{font-size:10px;color:var(--muted)}
.matrixBar{height:5px;background:var(--soft);border-radius:99px;margin-top:9px;overflow:hidden}
.matrixBar i{display:block;height:100%;width:var(--w);background:var(--ink)}
.emptyState{padding:32px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media(max-width:950px){.commandGrid,.authorityBand{grid-template-columns:1fr}.evidenceHero{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.phaseRail{grid-template-columns:1fr}.capabilityMatrix{grid-template-columns:1fr}.evidenceHero{grid-template-columns:1fr}}

/* ===== V15 CONTINUITY LAYER: LIBRARY / ROADMAP / SKILLS / AUTHORITY ===== */
.v15LibraryHead,.v15RoadmapHead,.v15SkillsHead,.v15AuthorityHead{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:14px}
.v15LibraryHead h2,.v15RoadmapHead h2,.v15SkillsHead h2,.v15AuthorityHead h2{font-size:28px;letter-spacing:-.045em;margin:7px 0}
.libraryStats,.roadmapStats,.skillStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.pathCard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:15px;position:relative;overflow:hidden}
.pathCard .num{font-size:22px;font-weight:700;letter-spacing:-.04em}
.pathCard .bar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.pathCard .bar i{display:block;height:100%;width:var(--w);background:var(--ink)}
.roadmapGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.roadmapNode{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;min-height:120px}
.roadmapNode .index{font-size:9px;letter-spacing:.15em;color:var(--muted)}
.roadmapNode h3{font-size:15px;margin:8px 0}
.roadmapNode p{font-size:11px}
.skillHeat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.skillHeat span{height:10px;border-radius:3px;background:var(--soft);position:relative}
.skillHeat span.on{background:var(--ink)}
.skillHeat span[data-v="20"]{opacity:.35}.skillHeat span[data-v="40"]{opacity:.5}.skillHeat span[data-v="60"]{opacity:.65}.skillHeat span[data-v="80"]{opacity:.82}
.authorityGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.signatureList{display:grid;gap:7px}
.signatureItem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.signatureItem b{font-size:11px}
.signatureItem span{font-size:9px;color:var(--muted)}
@media(max-width:950px){.libraryStats,.roadmapStats,.skillStats{grid-template-columns:repeat(2,1fr)}.roadmapGrid{grid-template-columns:1fr 1fr}.authorityGrid{grid-template-columns:1fr}}
@media(max-width:620px){.libraryStats,.roadmapStats,.skillStats,.roadmapGrid{grid-template-columns:1fr}}

/* ===== V15 INTERACTION / NAVIGATION LAYER ===== */
.v15ActionDock{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:0 0 14px}

function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let incoming=x&&x.state;if(!incoming||typeof incoming!=='object')throw Error('Invalid backup');let steps=incoming.steps&&typeof incoming.steps==='object'?incoming.steps:{};let clean={theme:incoming.theme==='dark'?'dark':'light',page:['home','capability','work','library','evidence','roadmap','skills','authority'].includes(incoming.page)?incoming.page:'home',steps:{},evidence:Array.isArray(incoming.evidence)?incoming.evidence:[],meta:incoming.meta&&typeof incoming.meta==='object'?incoming.meta:{}};Object.entries(steps).forEach(([id,v])=>{let n=Number(v);if(Number.isFinite(n))clean.steps[id]=Math.max(0,Math.min(5,Math.floor(n)))});S=clean;save();document.documentElement.dataset.theme=S.theme;render();toast('Backup imported safely.')}catch(e){toast('Import failed — invalid FORGE backup.')}};r.readAsText(f)};input.click()}
